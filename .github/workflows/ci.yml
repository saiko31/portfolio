name: CI Pipeline

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Validate Edge Worker Types
        run: npm run typecheck --workspace=@portfolio/edge-router

      - name: Build Web Application (Astro)
        run: npm run build --workspace=@portfolio/web
